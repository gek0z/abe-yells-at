version: 2
updates:
  # The bun ecosystem updates bun.lock itself; npm cannot, which left every
  # Dependabot PR with a stale lockfile that Dependabot could not rebase.
  # versioning-strategy is not supported for bun.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps):"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci):"
    groups:
      actions:
        patterns: ["*"]
